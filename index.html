<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFCEE" />
    <meta name="description" content="Roadies: hop into a voice chat with the drivers stuck in your traffic jam." />
    <title>Roadies</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F4682C'/%3E%3Ctext x='32' y='46' font-family='system-ui,sans-serif' font-size='40' font-weight='700' text-anchor='middle' fill='%23FFFCEE'%3ER%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="phone">
      <section id="screen-intro" class="screen intro" aria-label="Roadies">
        <div id="intro-stage" class="intro-stage">
          <svg viewBox="0 0 440 956" role="img" aria-label="Two cars draw the Roadies logo, say hi to each other, then drive off">
            <!-- Layer order matches the Figma frames: text, Rectangle 6, Rectangle 5, "3 1", "2 1". -->
            <g id="world">
              <g id="wordmark">
                <path id="ro" />
                <path id="adies" />
              </g>
              <g id="masks">
                <path id="mask6" />
                <path id="mask5" />
              </g>
              <g id="cars">
                <image id="car-red" preserveAspectRatio="xMidYMid slice" />
                <image id="car-teal" preserveAspectRatio="xMidYMid slice" />
              </g>
            </g>
            <g id="bubbles"></g>
          </svg>
        </div>
      </section>

      <section id="screen-home" class="screen home" aria-label="Your jam" hidden></section>
      <section id="screen-room" class="screen room" aria-label="Voice chat" hidden></section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
